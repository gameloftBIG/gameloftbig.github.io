  <section class="gallery-section">
    <div class="container">
      <h1 class="section-title fade-in">相册</h1>
      <p class="section-subtitle fade-in delay-1">记录生活中的美好瞬间</p>

      <div class="gallery-categories fade-in delay-2">
        <button class="active" data-category="all">全部</button>
        <button data-category="travel">旅行</button>
        <button data-category="life">日常</button>
        <button data-category="nature">自然</button>
      </div>

      <div class="gallery-albums">
        <div class="album-card" data-album="yichang">
          <div class="album-cover">
            <img src="images/gallery/travel/Yichang/IMG_20260525_145304.jpg" alt="2026年5月宜昌旅行" loading="lazy">
            <div class="album-overlay">
              <div class="album-overlay-content">
                <i class="fas fa-images"></i>
                <span>查看相册</span>
                <span class="photo-count">15张照片</span>
              </div>
            </div>
          </div>
          <div class="album-info">
            <h3>2026年5月宜昌旅行</h3>
            <p>2026年5月 · 湖北宜昌</p>
          </div>
        </div>
      </div>
    </div>
  </section>

      </div>

        <div class="album-grid">

            <img src="images/gallery/travel/Yichang/IMG_20260525_145304.jpg" alt="宜昌风光" loading="lazy">
          </div>
          <div class="album-image-item" data-src="images/gallery/travel/Yichang/IMG_20260525_162031.jpg" data-title="宜昌街景" data-date="2026年5月25日">

          </div>
          <div class="album-image-item" data-src="images/gallery/travel/Yichang/IMG_20260526_112421.jpg" data-title="晨曦宜昌" data-date="2026年5月26日">
            <img src="images/gallery/travel/Yichang/IMG_20260526_112421.jpg" alt="晨曦宜昌" loading="lazy">
          </div>
          <div class="album-image-item" data-src="images/gallery/travel/Yichang/IMG_20260526_113509.jpg" data-title="山水画卷" data-date="2026年5月26日">

  <div class="image-modal" id="imageModal">
    <button class="close-btn" onclick="closeImageModal()"><i class="fas fa-times"></i></button>
    <button class="nav-btn prev-btn" onclick="prevZoomImage()"><i class="fas fa-chevron-left"></i></button>
    <div class="image-modal-content">
      <img id="zoomImage" src="" alt="">
      <div class="image-info">
        <h3 id="zoomTitle"></h3>
        <p id="zoomDate"></p>
      </div>
    </div>
    <button class="nav-btn next-btn" onclick="nextZoomImage()"><i class="fas fa-chevron-right"></i></button>
