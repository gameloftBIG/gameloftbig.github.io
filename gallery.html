<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册 - RuoYing</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512x512.png">
  <link rel="apple-touch-icon" href="favicon-512x512.png">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="favicon-512x512.png" alt="Avatar" class="avatar">
        <span>R</span><span class="logo-text">uoYing</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">关于</a></li>
        <li><a href="blog.html">博客</a></li>
        <li><a href="notes.html">笔记</a></li>
        <li><a href="gallery.html" class="active">相册</a></li>
        <li><a href="contact.html">联系</a></li>
      </ul>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <section class="gallery-section">
    <div class="container">
      <h1 class="section-title fade-in">相册</h1>
      <p class="section-subtitle fade-in delay-1">记录生活中的美好瞬间</p>

      <div class="gallery-categories fade-in delay-2">
        <button class="active" data-category="all">全部</button>
        <button data-category="travel">旅行</button>
        <button data-category="life">日常</button>
        <button data-category="nature">自然</button>
      </div>

      <div class="gallery-grid">
        <div class="gallery-item fade-in" data-category="travel">
          <div class="gallery-image"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>城市夜景</h4>
            <p>2024年1月</p>
          </div>
        </div>

        <div class="gallery-item fade-in delay-1" data-category="nature">
          <div class="gallery-image" style="background: linear-gradient(135deg, #4CAF50, #8BC34A);"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>春日花海</h4>
            <p>2024年3月</p>
          </div>
        </div>

        <div class="gallery-item fade-in delay-2" data-category="life">
          <div class="gallery-image" style="background: linear-gradient(135deg, #FF9800, #FFC107);"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>美食时光</h4>
            <p>2024年2月</p>
          </div>
        </div>

        <div class="gallery-item fade-in delay-3" data-category="travel">
          <div class="gallery-image" style="background: linear-gradient(135deg, #2196F3, #03A9F4);"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>海边日落</h4>
            <p>2024年1月</p>
          </div>
        </div>

        <div class="gallery-item fade-in" data-category="nature">
          <div class="gallery-image" style="background: linear-gradient(135deg, #9C27B0, #E91E63);"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>星空夜景</h4>
            <p>2024年1月</p>
          </div>
        </div>

        <div class="gallery-item fade-in delay-1" data-category="life">
          <div class="gallery-image" style="background: linear-gradient(135deg, #607D8B, #9E9E9E);"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>书房一角</h4>
            <p>2024年2月</p>
          </div>
        </div>

        <div class="gallery-item fade-in delay-2" data-category="travel">
          <div class="gallery-image" style="background: linear-gradient(135deg, #00BCD4, #009688);"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>古镇风情</h4>
            <p>2024年2月</p>
          </div>
        </div>

        <div class="gallery-item fade-in delay-3" data-category="nature">
          <div class="gallery-image" style="background: linear-gradient(135deg, #FF5722, #F44336);"></div>
          <div class="gallery-overlay">
            <i class="fas fa-search-plus"></i>
          </div>
          <div class="gallery-info">
            <h4>秋叶缤纷</h4>
            <p>2023年11月</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="gallery-modal" id="galleryModal">
    <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
    <button class="nav-btn prev-btn" onclick="prevImage()"><i class="fas fa-chevron-left"></i></button>
    <div class="modal-content">
      <img id="modalImage" src="" alt="">
      <div class="modal-info">
        <h3 id="modalTitle"></h3>
        <p id="modalDate"></p>
      </div>
    </div>
    <button class="nav-btn next-btn" onclick="nextImage()"><i class="fas fa-chevron-right"></i></button>
  </div>

  <footer>
    <div class="container" style="padding: 50px 20px; text-align: center; border-top: 1px solid var(--glass-border);">
      <p>&copy; 2026 RuoYing. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/shooting-stars.js"></script>
<script src="js/main.js"></script>
  <script src="js/animation.js"></script>
</body>

</html>
