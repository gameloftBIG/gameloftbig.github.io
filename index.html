<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>若滢 · gameloftBIG</title>

    <!-- 圆润可爱的英文字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            /* —— 柔和可爱 × 科技几何 调色板 —— */
            --bg-base: #f8f6fa;
            --surface: #ffffff;
            --text-primary: #2d2a35;
            --text-secondary: #5c5a66;
            --text-muted: #8c8a96;
            --accent-pink: #f0c4d0;
            --accent-lavender: #d4c8f0;
            --accent-sky: #c4daf0;
            --accent-mint: #c4f0e0;
            --accent-peach: #f0dcc4;
            --accent-butter: #f0ecc4;
            --accent-rose: #e8bcc8;
            --accent-periwinkle: #c8d0f0;
            --accent-aqua: #c0e8e0;
            --accent-coral: #f0ccc8;

            --shadow-sm: 0 1px 3px rgba(40, 30, 50, 0.04), 0 1px 2px rgba(40, 30, 50, 0.06);
            --shadow-md: 0 4px 14px rgba(40, 30, 50, 0.06), 0 2px 6px rgba(40, 30, 50, 0.08);
            --shadow-lg: 0 8px 30px rgba(40, 30, 50, 0.08), 0 4px 12px rgba(40, 30, 50, 0.10);
            --shadow-xl: 0 16px 50px rgba(40, 30, 50, 0.10), 0 6px 18px rgba(40, 30, 50, 0.12);

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --radius-full: 9999px;

            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.15, 1);
            --transition-bouncy: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-slow: 0.8s cubic-bezier(0.4, 0, 0.15, 1);
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: 'Nunito', 'Quicksand', 'PingFang SC', 'Microsoft YaHei', 'STHeiti', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;

            /* 微妙的点阵纹理 - 科技几何感 */
            background-image:
                radial-gradient(circle, rgba(140, 130, 160, 0.08) 1px, transparent 1px),
                radial-gradient(circle, rgba(160, 150, 180, 0.05) 0.7px, transparent 0.7px);
            background-size: 28px 28px, 18px 18px;
            background-position: 0 0, 9px 9px;
        }

        /* ========== 背景几何图片墙容器 ========== */
        .geo-wall {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 16px;
            padding: 24px;
            opacity: 0.9;
        }

        /* 每个几何色块 */
        .geo-tile {
            position: relative;
            border-radius: var(--radius-md);
            will-change: background-color, transform, border-radius;
            transition: border-radius var(--transition-slow);
            box-shadow: var(--shadow-sm);
            /* 白色边框模拟画框 */
            border: 2.5px solid rgba(255, 255, 255, 0.55);
            animation: tileColorShift 14s ease-in-out infinite;
            animation-fill-mode: both;
        }

        /* 不同色块的动画延迟——创造波浪式切换 */
        .geo-tile:nth-child(1) {
            animation-delay: 0s;
            grid-column: 1 / 3;
            grid-row: 1 / 2;
            border-radius: 28px;
        }
        .geo-tile:nth-child(2) {
            animation-delay: -2.5s;
            grid-column: 3 / 5;
            grid-row: 1 / 3;
            border-radius: 50%;
            /* 圆形 */;
        }
        .geo-tile:nth-child(3) {
            animation-delay: -5s;
            grid-column: 5 / 7;
            grid-row: 1 / 2;
            border-radius: 18px;
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            /* 五边形 */;
        }
        .geo-tile:nth-child(4) {
            animation-delay: -7.5s;
            grid-column: 1 / 2;
            grid-row: 2 / 4;
            border-radius: 50%;
            /* 小圆 */;
        }
        .geo-tile:nth-child(5) {
            animation-delay: -10s;
            grid-column: 2 / 4;
            grid-row: 2 / 3;
            border-radius: 22px;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            /* 菱形 */;
        }
        .geo-tile:nth-child(6) {
            animation-delay: -3.5s;
            grid-column: 5 / 7;
            grid-row: 2 / 4;
            border-radius: 30px;
        }
        .geo-tile:nth-child(7) {
            animation-delay: -6s;
            grid-column: 2 / 4;
            grid-row: 3 / 5;
            border-radius: 50%;
            /* 大圆 */;
        }
        .geo-tile:nth-child(8) {
            animation-delay: -8.5s;
            grid-column: 4 / 6;
            grid-row: 3 / 4;
            border-radius: 14px;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            /* 六边形 */;
        }
        .geo-tile:nth-child(9) {
            animation-delay: -11s;
            grid-column: 1 / 2;
            grid-row: 4 / 5;
            border-radius: 20px;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            /* 小菱形 */;
        }
        .geo-tile:nth-child(10) {
            animation-delay: -4s;
            grid-column: 6 / 7;
            grid-row: 4 / 5;
            border-radius: 50%;
            /* 小圆 */;
        }
        .geo-tile:nth-child(11) {
            animation-delay: -9s;
            grid-column: 4 / 5;
            grid-row: 4 / 5;
            border-radius: 24px;
        }
        .geo-tile:nth-child(12) {
            animation-delay: -1.5s;
            grid-column: 5 / 6;
            grid-row: 4 / 5;
            border-radius: 16px;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            /* 三角形 */;
        }

        /* 颜色切换动画——模拟幻灯片式切换 */
        @keyframes tileColorShift {
            0%,
            38% {
                background-color: var(--color-a, #f0c4d0);
                transform: scale(1);
                opacity: 0.85;
            }
            42%,
            44% {
                transform: scale(0.94);
                opacity: 0.65;
            }
            46%,
            80% {
                background-color: var(--color-b, #d4c8f0);
                transform: scale(1);
                opacity: 0.85;
            }
            84%,
            86% {
                transform: scale(0.94);
                opacity: 0.65;
            }
            90%,
            100% {
                background-color: var(--color-a, #f0c4d0);
                transform: scale(1);
                opacity: 0.85;
            }
        }

        /* 为每个色块分配不同的颜色对，创造丰富的图片墙效果 */
        .geo-tile:nth-child(1) {
            --color-a: #f0c4d0;
            --color-b: #d4c8f0;
        }
        .geo-tile:nth-child(2) {
            --color-a: #c4daf0;
            --color-b: #f0dcc4;
        }
        .geo-tile:nth-child(3) {
            --color-a: #c4f0e0;
            --color-b: #f0c4d0;
        }
        .geo-tile:nth-child(4) {
            --color-a: #f0ecc4;
            --color-b: #c4daf0;
        }
        .geo-tile:nth-child(5) {
            --color-a: #d4c8f0;
            --color-b: #c4f0e0;
        }
        .geo-tile:nth-child(6) {
            --color-a: #f0dcc4;
            --color-b: #d4c8f0;
        }
        .geo-tile:nth-child(7) {
            --color-a: #c8d0f0;
            --color-b: #f0c4d0;
        }
        .geo-tile:nth-child(8) {
            --color-a: #f0ccc8;
            --color-b: #c4daf0;
        }
        .geo-tile:nth-child(9) {
            --color-a: #c0e8e0;
            --color-b: #f0ecc4;
        }
        .geo-tile:nth-child(10) {
            --color-a: #e8bcc8;
            --color-b: #c4f0e0;
        }
        .geo-tile:nth-child(11) {
            --color-a: #f0c4d0;
            --color-b: #c8d0f0;
        }
        .geo-tile:nth-child(12) {
            --color-a: #d4c8f0;
            --color-b: #f0dcc4;
        }

        /* ========== 浮动几何粒子 ========== */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            border-radius: 50%;
            animation: particleFloat 12s ease-in-out infinite;
            animation-fill-mode: both;
            will-change: transform, opacity;
        }
        .particle:nth-child(13) {
            width: 16px;
            height: 16px;
            background: rgba(200, 180, 220, 0.55);
            top: 12%;
            left: 8%;
            animation-delay: 0s;
            animation-duration: 14s;
            border-radius: 4px;
            /* 小方 */;
        }
        .particle:nth-child(14) {
            width: 10px;
            height: 10px;
            background: rgba(220, 190, 180, 0.5);
            top: 72%;
            left: 85%;
            animation-delay: -3s;
            animation-duration: 11s;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            /* 小三角 */;
        }
        .particle:nth-child(15) {
            width: 20px;
            height: 20px;
            background: rgba(180, 200, 220, 0.45);
            top: 25%;
            left: 78%;
            animation-delay: -6s;
            animation-duration: 16s;
            border-radius: 3px;
            /* 小方 */;
        }
        .particle:nth-child(16) {
            width: 12px;
            height: 12px;
            background: rgba(200, 220, 210, 0.55);
            top: 60%;
            left: 12%;
            animation-delay: -9s;
            animation-duration: 13s;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            /* 小菱形 */;
        }
        .particle:nth-child(17) {
            width: 8px;
            height: 8px;
            background: rgba(230, 200, 190, 0.6);
            top: 40%;
            left: 92%;
            animation-delay: -4s;
            animation-duration: 15s;
            border-radius: 50%;
            /* 小圆 */;
        }
        .particle:nth-child(18) {
            width: 14px;
            height: 14px;
            background: rgba(190, 200, 230, 0.5);
            top: 80%;
            left: 45%;
            animation-delay: -7s;
            animation-duration: 10s;
            border-radius: 2px;
            /* 小方 */;
        }
        .particle:nth-child(19) {
            width: 18px;
            height: 18px;
            background: rgba(210, 190, 210, 0.4);
            top: 15%;
            left: 48%;
            animation-delay: -2s;
            animation-duration: 17s;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            /* 小六边形 */;
        }
        .particle:nth-child(20) {
            width: 9px;
            height: 9px;
            background: rgba(180, 210, 200, 0.55);
            top: 55%;
            left: 65%;
            animation-delay: -10s;
            animation-duration: 12s;
            border-radius: 50%;
            /* 小圆 */;
        }

        @keyframes particleFloat {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.45;
            }
            15% {
                transform: translate(18px, -22px) scale(1.25);
                opacity: 0.7;
            }
            30% {
                transform: translate(-12px, -35px) scale(0.85);
                opacity: 0.4;
            }
            50% {
                transform: translate(-25px, -8px) scale(1.15);
                opacity: 0.65;
            }
            65% {
                transform: translate(10px, 20px) scale(0.9);
                opacity: 0.5;
            }
            80% {
                transform: translate(22px, 15px) scale(1.1);
                opacity: 0.6;
            }
            92% {
                transform: translate(-8px, -10px) scale(0.95);
                opacity: 0.5;
            }
        }

        /* ========== 主卡片 ========== */
        .main-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 560px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: var(--radius-xl);
            border: 1.5px solid rgba(255, 255, 255, 0.65);
            box-shadow: var(--shadow-xl), 0 0 0 1px rgba(255, 255, 255, 0.4) inset;
            padding: 48px 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            animation: cardAppear 1s ease-out both;
            transition: box-shadow var(--transition-smooth), border-color var(--transition-smooth);
        }
        .main-card:hover {
            box-shadow: var(--shadow-xl), 0 0 0 1px rgba(255, 255, 255, 0.55) inset,
                0 0 60px rgba(180, 160, 210, 0.12);
            border-color: rgba(255, 255, 255, 0.8);
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* 卡片顶部几何装饰条 */
        .card-geo-accent {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            align-items: center;
            animation: fadeIn 0.8s ease-out 0.2s both;
        }
        .card-geo-accent span {
            display: block;
            border-radius: 50%;
            animation: accentPulse 3s ease-in-out infinite;
        }
        .card-geo-accent span:nth-child(1) {
            width: 10px;
            height: 10px;
            background: #e8bcc8;
            animation-delay: 0s;
        }
        .card-geo-accent span:nth-child(2) {
            width: 6px;
            height: 6px;
            background: #c4daf0;
            animation-delay: -0.6s;
        }
        .card-geo-accent span:nth-child(3) {
            width: 14px;
            height: 14px;
            background: #d4c8f0;
            animation-delay: -1.2s;
            border-radius: 3px;
        }
        .card-geo-accent span:nth-child(4) {
            width: 7px;
            height: 7px;
            background: #c4f0e0;
            animation-delay: -1.8s;
        }
        .card-geo-accent span:nth-child(5) {
            width: 11px;
            height: 11px;
            background: #f0dcc4;
            animation-delay: -2.4s;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            border-radius: 0;
        }

        @keyframes accentPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 名字区域 */
        .name-block {
            text-align: center;
            animation: fadeIn 0.8s ease-out 0.35s both;
        }
        .name-cn {
            font-family: 'Quicksand', 'Nunito', 'PingFang SC', 'Microsoft YaHei', 'STHeiti', 'Noto Sans SC', sans-serif;
            font-size: clamp(3.2rem, 6.5vw, 5rem);
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #2d2a35;
            line-height: 1.1;
            transition: letter-spacing var(--transition-smooth), color var(--transition-smooth);
            cursor: default;
            user-select: none;
            position: relative;
            display: inline-block;
        }
        .name-cn:hover {
            letter-spacing: 0.14em;
            color: #1a1820;
        }
        /* 名字下方的可爱下划线 */
        .name-cn::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 15%;
            width: 70%;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg,
                    transparent,
                    #e8bcc8 20%,
                    #d4c8f0 50%,
                    #c4daf0 80%,
                    transparent);
            transform: scaleX(0.5);
            transition: transform var(--transition-bouncy);
            opacity: 0.7;
        }
        .name-cn:hover::after {
            transform: scaleX(1);
            opacity: 1;
        }

        .name-en {
            font-family: 'Nunito', 'Quicksand', 'SF Mono', 'Consolas', 'Menlo', monospace;
            font-size: clamp(0.8rem, 1.4vw, 0.95rem);
            font-weight: 500;
            letter-spacing: 0.22em;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
            transition: color var(--transition-smooth), letter-spacing var(--transition-smooth);
            cursor: default;
            user-select: none;
        }
        .name-en:hover {
            color: var(--text-secondary);
            letter-spacing: 0.3em;
        }

        /* 格言 */
        .motto {
            font-family: 'Nunito', 'Quicksand', 'PingFang SC', 'Microsoft YaHei', 'STHeiti', 'Noto Sans SC', sans-serif;
            font-size: clamp(0.95rem, 1.55vw, 1.1rem);
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--text-secondary);
            margin-top: 14px;
            position: relative;
            padding: 0 20px;
            animation: fadeIn 0.8s ease-out 0.45s both;
            cursor: default;
            user-select: none;
            transition: color var(--transition-smooth);
        }
        .motto:hover {
            color: var(--text-primary);
        }
        /* 格言两侧的几何小装饰 */
        .motto::before,
        .motto::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: #d4c8f0;
            transform: translateY(-50%) rotate(45deg);
            transition: transform var(--transition-bouncy), background var(--transition-smooth),
        width var(--transition-bouncy), height var(--transition-bouncy);
            opacity: 0.7;
        }
        .motto::before {
            right: calc(100% + 10px);
        }
        .motto::after {
            left: calc(100% + 10px);
        }
        .motto:hover::before,
        .motto:hover::after {
            width: 12px;
            height: 12px;
            transform: translateY(-50%) rotate(0deg);
            background: #e8bcc8;
            opacity: 1;
        }

        /* 分隔线 */
        .divider-line {
            width: 50px;
            height: 2.5px;
            border-radius: 3px;
            background: linear-gradient(90deg,
                    transparent,
                    #d4c8f0 25%,
                    #e8bcc8 50%,
                    #c4daf0 75%,
                    transparent);
            margin: 24px auto 28px;
            border: none;
            animation: fadeIn 0.8s ease-out 0.55s both;
            transition: width var(--transition-bouncy);
        }
        .main-card:hover .divider-line {
            width: 70px;
        }

        /* 按钮区域 */
        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out 0.65s both;
        }
        .btn-card {
            text-decoration: none;
            flex: 1;
            min-width: 140px;
            max-width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 22px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-full);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition:
                background var(--transition-smooth),
                border-color var(--transition-smooth),
                box-shadow var(--transition-bouncy),
                transform var(--transition-bouncy);
            box-shadow: var(--shadow-md);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .btn-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-full);
            opacity: 0;
            background: linear-gradient(135deg,
                    rgba(240, 196, 208, 0.25) 0%,
                    rgba(212, 200, 240, 0.25) 50%,
                    rgba(196, 218, 240, 0.25) 100%);
            transition: opacity var(--transition-smooth);
            z-index: 0;
            pointer-events: none;
        }
        .btn-card:hover {
            border-color: rgba(220, 200, 230, 0.8);
            box-shadow: var(--shadow-lg), 0 0 30px rgba(200, 180, 220, 0.18);
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.8);
        }
        .btn-card:hover::before {
            opacity: 1;
        }
        .btn-card:active {
            transform: translateY(-1px) scale(0.97);
            box-shadow: var(--shadow-md);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-card:focus-visible {
            border-color: #d4c8f0;
            box-shadow: var(--shadow-lg), 0 0 0 4px rgba(212, 200, 240, 0.25);
        }

        /* 按钮图标 */
        .btn-icon {
            position: relative;
            z-index: 1;
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            transition: transform var(--transition-bouncy);
        }
        .btn-card:hover .btn-icon {
            transform: scale(1.12) rotate(-5deg);
        }
        .btn-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #6b5e7a;
            stroke-width: 2;
